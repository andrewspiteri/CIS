name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v5.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: dotnet restore ChangeImpactStudio.slnx
      - run: dotnet build ChangeImpactStudio.slnx -c Release --no-restore
      # Test projects create isolated filesystem fixtures. A single MSBuild worker
      # prevents hosted Windows resource contention without retrying failed tests.
      - run: dotnet test ChangeImpactStudio.slnx -c Release --no-build --no-restore --maxcpucount:1
      - run: node --check vscode-extension/extension.js
      - run: node --test vscode-extension/test/*.test.js
      - shell: pwsh
        run: |
          dotnet run --project src/Cis.Host -- docs validate --repo . --strict --format agent
          dotnet run --project src/Cis.Host -- skills validate --repo . --strict --format agent
          dotnet run --project src/Cis.Host -- test validate --repo . --strict --format agent

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Semgrep SAST
        run: node tools/run-security-scan.mjs sast
      - name: Gitleaks secret scan
        run: node tools/run-security-scan.mjs secrets
      - name: Trivy filesystem scan
        run: node tools/run-security-scan.mjs filesystem
      - name: Retain normalized scanner evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cis-security-evidence
          path: .cis/local/security/results
          if-no-files-found: error

  release-smoke:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v5.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - shell: pwsh
        run: ./tools/build-release.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cis-release-smoke
          path: artifacts/release
