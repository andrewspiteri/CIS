name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - shell: pwsh
        run: |
          $version = ([xml](Get-Content Version.props -Raw)).Project.PropertyGroup.VersionPrefix
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag and Version.props differ." }
          ./tools/build-release.ps1
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/release/*
          generate_release_notes: true
