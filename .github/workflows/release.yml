name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: node tools/run-security-scan.mjs sast
      - run: node tools/run-security-scan.mjs secrets
      - run: node tools/run-security-scan.mjs filesystem
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cis-release-security-evidence
          path: .cis/local/security/results
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

  assurance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v5.0.0
        with:
          global-json-file: global.json
      - run: dotnet restore ChangeImpactStudio.slnx --configfile NuGet.Config
      - run: dotnet build ChangeImpactStudio.slnx -c Release --no-restore
      - shell: pwsh
        run: ./tools/run-dotnet-tests.ps1 -MinimumLineCoverage 75
      - run: dotnet tool restore
      - shell: pwsh
        run: ./tools/run-mutation.ps1
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cis-release-assurance-evidence
          path: |
            .cis/local/testing/coverage
            .cis/local/testing/mutation
            .cis/local/testing/results
            .cis/local/testing/runs
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

  release:
    needs: [security, assurance]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v5.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = ([xml](Get-Content Version.props -Raw)).Project.PropertyGroup.VersionPrefix
          if ("v$version" -ne "$env:RELEASE_TAG") { throw "Tag and Version.props differ." }
          ./tools/build-release.ps1
      - uses: softprops/action-gh-release@fe965f7af51af5f2602596916f38a38df2e33de0 # v3.0.2
        with:
          files: artifacts/release/*
          generate_release_notes: true
